[project]
name = "mavis-worker"
version = "0.1.0"
description = "MAVIS AI inference worker"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavis"]