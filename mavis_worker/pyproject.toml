[project]
name = "mavis-worker"
version = "0.3.0"
description = "MAVIS AI inference worker"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.2.90",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mavis"]

[tool.ruff]
line-length = 100