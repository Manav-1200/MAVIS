[package]
name = "mavis_core"
version = "0.1.0"
edition = "2021"
authors = ["Manav"]
description = "MAVIS runtime core"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
minifb = "0.25"

[profile.release]
opt-level = 3
lto = true