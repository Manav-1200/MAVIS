# mavis_core/Cargo.toml
[package]
name = "mavis_core"
version = "0.1.0"
edition = "2021"
authors = ["Manav"]
description = "MAVIS runtime core"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
minifb = "0.25"
notify = "6"

# STT — audio capture (cpal) and base64 encoding for audio over UDS
cpal = "0.15"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true

# The orb as a Wayland overlay (layer shell): floats on every workspace and
# never takes focus. Falls back to the minifb window where unavailable.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }