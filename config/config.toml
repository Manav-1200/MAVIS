# config/config.toml
# ============================================================================
# MAVIS Configuration
# ============================================================================
# This file contains user-configurable settings.
#
# Values in this file may be changed without modifying the source code.
# ============================================================================

[application]
name = "MAVIS"
version = "0.1.0"
debug = false

[logging]
level = "INFO"

[ui]
theme = "dark"

[voice]
enabled = true
# "always" listens all the time; "push" listens only after the hotkey or a
# tap on the orb. MAVIS_LISTEN_MODE overrides it.
listen_mode = "always"

[context]
# What MAVIS may know about your desktop. Everything stays on this machine.
# Each MAVIS_CONTEXT_* variable overrides its line for one run.
active_window = true     # the focused window, open apps and their workspaces
calendar = false
browser = false

[sentinel]
# Watch the package log, privileged accounts and system files for changes.
# MAVIS_SENTINEL overrides it for one run.
enabled = true

[stt]
# Whisper model for speech recognition. "small.en" is English-only and
# hears English better than "small" at the same speed (downloaded once,
# about 460 MB). "medium.en" is better again, but roughly 3x slower on CPU.
model = "small.en"
device = "cpu"           # "cuda" only if the GPU has room beside the LLM
compute_type = "int8"    # "float16" with cuda

[media]
# "play X" in a browser. {query} is what you asked for. Change all four
# lines to use another site; with only search_url, its search page opens.
site_name = "YouTube"
search_url = "https://www.youtube.com/results?search_query={query}"
# To play the top result instead of showing the search: the text just
# before a result's id on the results page, and the link for that id.
result_marker = '"videoRenderer":{"videoId":"'
play_url = "https://www.youtube.com/watch?v={id}"

[web]
# "search for X", "look up X", "google X".
search_url = "https://www.google.com/search?q={query}"

[ai]
provider = "local"

[model]
# Qwen2.5-3B-Instruct, Q4_K_M (about 2 GB). If the file is missing, the
# worker tries Qwen, Phi-3 and TinyLlama files in the same folder.
path = "~/.local/share/mavis/models/qwen2.5-3b-instruct-q4_k_m.gguf"
# How much conversation the model can see at once, in tokens. Capped at
# what the model was trained for (Phi-3 mini: 4096).
n_ctx = 16384
# -1: the whole model on the graphics card. If it doesn't fit, the worker
# retries with 20 layers there and the rest on the processor.
n_gpu_layers = -1
verbose = false

[worker]
idle_timeout = 300