# config/config.toml
# ============================================================================
# MAVIS Configuration
# ============================================================================
# This file contains user-configurable settings.
#
# Values in this file may be changed without modifying the source code.
# ============================================================================

[application]
name = "MAVIS"
version = "0.1.0"
debug = false

[logging]
level = "INFO"

[ui]
theme = "dark"

[voice]
enabled = true
# "always" listens all the time; "push" listens only after the hotkey or a
# tap on the orb. MAVIS_LISTEN_MODE overrides it.
listen_mode = "always"

[stt]
# Whisper model for speech recognition. "small.en" is English-only and
# hears English better than "small" at the same speed (downloaded once,
# about 460 MB). "medium.en" is better again, but roughly 3x slower on CPU.
model = "small.en"
device = "cpu"           # "cuda" only if the GPU has room beside the LLM
compute_type = "int8"    # "float16" with cuda

[ai]
provider = "local"

[model]
# What has actually been running. If the file is missing, the worker tries
# the Phi-3 and TinyLlama files in the same folder.
path = "~/.local/share/mavis/models/Phi-3-mini-4k-instruct-Q4_K_M.gguf"
n_ctx = 4096
n_gpu_layers = 20        # full offload (-1) failed on 6 GB
verbose = false

[worker]
idle_timeout = 300