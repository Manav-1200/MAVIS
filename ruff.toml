# ruff.toml

target-version = "py314"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

ignore = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true